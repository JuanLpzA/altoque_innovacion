spring.config.import=optional:file:.env[.properties]
spring.application.name=altoque

server.port=${PORT:8080}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT
jwt.secret=${JWT_SECRET:altoque_clave_super_secreta_2026_JLO_municipal_railway_123456789}
jwt.expiration=86400000

# Cloudinary
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api_key=${CLOUDINARY_API_KEY}
cloudinary.api_secret=${CLOUDINARY_API_SECRET}

# Gemini
gemini.api.key=${GEMINI_API_KEY}

# Multipart (fotos)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

brevo.api.key=${BREVO_API_KEY}
brevo.sender.email=${BREVO_SENDER_EMAIL}
brevo.sender.name=Altoque Municipalidad

# Decolecta (RENIEC)
decolecta.api.url=https://api.decolecta.com/v1/reniec/dni?numero={dni}
decolecta.api.token=${DECOLECTA_API_TOKEN}

# URL base de tu app para construir los links de los correos
app.base-url=${APP_BASE_URL}

spring.jackson.time-zone=America/Lima
