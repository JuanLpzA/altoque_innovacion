<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Altoque – Evidencias y Avances</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
          --sidebar-bg: #1a3a8f;
          --accent: #0fa89a;
          --bg: #f0f5fb;
          --card: #fff;
          --text: #111827;
          --muted: #9ca3af;
          --border: #f3f4f6;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); min-height: 100vh; display: flex; }
        .sidebar { width: 220px; background: var(--sidebar-bg); min-height: 100vh; display: flex; flex-direction: column; flex-shrink: 0; position: sticky; top: 0; height: 100vh; }
        .sidebar-brand { padding: 1.4rem 1.4rem .9rem; font-size: 1.3rem; font-weight: 900; color: #fff; letter-spacing: -.02em; border-bottom: 1px solid rgba(255,255,255,.08); }
        .sidebar-brand span { color: var(--accent); }
        .sidebar-section { padding: .9rem 1.4rem .3rem; font-size: .62rem; font-weight: 700; color: rgba(255,255,255,.3); text-transform: uppercase; letter-spacing: .1em; }
        .sidebar-nav a { display: flex; align-items: center; gap: .65rem; padding: .62rem 1.4rem; color: rgba(255,255,255,.62); text-decoration: none; font-size: .84rem; font-weight: 500; transition: background .15s, color .15s; }
        .sidebar-nav a:hover { background: rgba(255,255,255,.07); color: #fff; }
        .sidebar-nav a.active { background: rgba(255,255,255,.13); color: #fff; border-right: 3px solid var(--accent); }
        .sidebar-nav a i { font-size: 1.05rem; opacity: .85; }
        .sidebar-footer { margin-top: auto; padding: 1rem 1.4rem; border-top: 1px solid rgba(255,255,255,.08); }
        .sidebar-user { display: flex; align-items: center; gap: .6rem; }
        .avatar-sm { width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,.13); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .avatar-sm i { color: #fff; font-size: .95rem; }
        .user-info { flex: 1; min-width: 0; }
        .user-name { color: #fff; font-weight: 600; font-size: .78rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .user-role { color: rgba(255,255,255,.4); font-size: .67rem; }
        .btn-logout { background: none; border: none; color: rgba(255,255,255,.4); cursor: pointer; font-size: 1rem; padding: .2rem; transition: color .15s; }
        .btn-logout:hover { color: #fff; }
        .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
        .topbar { background: var(--card); padding: .9rem 1.8rem; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; }
        .topbar-title { font-size: 1rem; font-weight: 700; color: var(--text); }
        .content { padding: 1.6rem 1.8rem; }

        /* ── MINI DASHBOARD ── */
        .mini-dash { display: flex; gap: .8rem; margin-bottom: 1.3rem; flex-wrap: wrap; }
        .mini-card { flex: 1; min-width: 160px; background: var(--card); border-radius: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.05); padding: .9rem 1.1rem; display: flex; flex-direction: column; gap: .15rem; }
        .mini-card-val { font-size: 1.5rem; font-weight: 800; color: var(--text); }
        .mini-card-label { font-size: .68rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
        .mini-card.atraso .mini-card-val { color: #b91c1c; }
        .mini-card.semana .mini-card-val { color: #1d4ed8; }
        .mini-card.promedio .mini-card-val { color: #0fa89a; }

        /* ── ALERTA DE ATRASOS ── */
        .atrasos-panel { background: var(--card); border-radius: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.05); margin-bottom: 1.3rem; overflow: hidden; }
        .atrasos-head { display: flex; align-items: center; gap: .6rem; padding: .9rem 1.2rem; border-bottom: 1px solid var(--border); cursor: pointer; }
        .atrasos-head i.ti-alert-triangle { color: #b91c1c; font-size: 1.1rem; }
        .atrasos-head-title { font-weight: 700; font-size: .88rem; color: var(--text); flex: 1; }
        .atrasos-head .ti-chevron-down { color: var(--muted); transition: transform .2s; }
        .atrasos-panel.colapsado .ti-chevron-down { transform: rotate(-90deg); }
        .atrasos-panel.colapsado .atrasos-body { display: none; }
        .atrasos-body { max-height: 280px; overflow-y: auto; }
        .atraso-row { display: flex; align-items: center; gap: .8rem; padding: .65rem 1.2rem; border-bottom: 1px solid var(--border); font-size: .8rem; }
        .atraso-row:last-child { border-bottom: none; }
        .atraso-dias { flex-shrink: 0; background: #fef2f2; color: #b91c1c; font-weight: 800; font-size: .72rem; padding: .25rem .55rem; border-radius: 8px; min-width: 64px; text-align: center; }
        .atraso-info { flex: 1; min-width: 0; }
        .atraso-tit { font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .atraso-meta { color: var(--muted); font-size: .72rem; margin-top: .1rem; }
        .atraso-pct { flex-shrink: 0; font-size: .75rem; color: #374151; font-weight: 600; }
        .atrasos-vacio { padding: 1.4rem 1.2rem; text-align: center; color: var(--muted); font-size: .82rem; }

        /* ── FILTROS ── */
        .filtros-bar { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; background: var(--card); border-radius: 14px; padding: .8rem 1rem; margin-bottom: 1.2rem; box-shadow: 0 2px 10px rgba(0,0,0,.05); }
        .filtros-bar label { font-size: .68rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-right: -.3rem; }
        .filtros-bar select, .filtros-bar input[type=date] { font-size: .8rem; padding: .4rem .6rem; border-radius: 8px; border: 1px solid #e5e7eb; background: #fff; color: var(--text); cursor: pointer; }
        .filtros-resumen { font-size: .75rem; color: var(--muted); margin-left: auto; }
        .btn-reset-filtros { font-size: .75rem; font-weight: 600; color: var(--sidebar-bg); background: none; border: 1px solid #dbe3f5; border-radius: 8px; padding: .35rem .7rem; cursor: pointer; }
        .btn-reset-filtros:hover { background: #f0f5fb; }

        /* ── GRID EVIDENCIAS ── */
        .ev-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem; }
        .ev-card { background: var(--card); border-radius: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.05); overflow: hidden; transition: box-shadow .2s, transform .2s; cursor: pointer; }
        .ev-card:hover { box-shadow: 0 6px 24px rgba(0,0,0,.1); transform: translateY(-2px); }
        .ev-foto-wrap { position: relative; height: 180px; background: #f3f4f6; overflow: hidden; }
        .ev-foto { width: 100%; height: 100%; object-fit: cover; transition: transform .3s; }
        .ev-card:hover .ev-foto { transform: scale(1.04); }
        .ev-foto-placeholder { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
        .ev-foto-placeholder i { font-size: 2.5rem; color: #d1d5db; }
        .ev-porcentaje { position: absolute; top: .6rem; right: .6rem; background: rgba(0,0,0,.65); color: #fff; font-size: .7rem; font-weight: 700; padding: .2rem .55rem; border-radius: 99px; display: flex; align-items: center; gap: .3rem; }
        .ev-riesgo { position: absolute; top: .6rem; left: .6rem; font-size: .63rem; font-weight: 700; padding: .2rem .55rem; border-radius: 99px; text-transform: uppercase; }
        .ev-riesgo.alto  { background: #fef2f2; color: #b91c1c; }
        .ev-riesgo.medio { background: #fffbeb; color: #b45309; }
        .ev-riesgo.bajo  { background: #f0fdf4; color: #15803d; }
        .ev-body { padding: .9rem 1rem; }
        .ev-reporte { font-size: .68rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-bottom: .3rem; display: flex; justify-content: space-between; gap: .4rem; }
        .ev-comentario { font-size: .82rem; color: #374151; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .ev-footer { padding: .65rem 1rem; border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
        .ev-user { display: flex; align-items: center; gap: .35rem; font-size: .72rem; color: #374151; font-weight: 500; }
        .ev-user i { color: var(--muted); font-size: .8rem; }
        .ev-fecha { font-size: .68rem; color: var(--muted); }
        .empty-state { text-align: center; padding: 4rem 2rem; color: var(--muted); grid-column: 1/-1; }
        .empty-state i { font-size: 3rem; margin-bottom: 1rem; display: block; opacity: .4; }
        .empty-state p { font-size: .88rem; }

        /* ── LIGHTBOX ── */
        .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.88); display: none; align-items: center; justify-content: center; z-index: 200; padding: 1.5rem; }
        .lightbox.open { display: flex; }
        .lightbox-inner { max-width: 760px; width: 100%; background: var(--card); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; max-height: 90vh; }
        .lightbox-img { width: 100%; max-height: 420px; object-fit: contain; background: #111; }
        .lightbox-body { padding: 1.2rem 1.4rem; overflow-y: auto; }
        .lightbox-reporte { font-size: .72rem; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; margin-bottom: .4rem; }
        .lightbox-comentario { font-size: .9rem; color: var(--text); line-height: 1.65; margin-bottom: .8rem; }
        .lightbox-meta { display: flex; gap: 1.2rem; font-size: .78rem; color: var(--muted); flex-wrap: wrap; }
        .lightbox-close { position: absolute; top: 1rem; right: 1rem; background: rgba(255,255,255,.12); border: none; border-radius: 50%; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #fff; font-size: 1.1rem; transition: background .15s; }
        .lightbox-close:hover { background: rgba(255,255,255,.2); }
    </style>
</head>
<body>
<!-- SIDEBAR -->
<div th:replace="~{admin/fragments/sidebar :: sidebar('evidencias')}"></div>
<!-- MAIN -->
<div class="main">
    <div class="topbar">
        <div class="topbar-title">Evidencias y avances</div>
    </div>
    <div class="content">

        <!-- MINI DASHBOARD -->
        <div class="mini-dash">
            <div class="mini-card">
                <div class="mini-card-val" id="md-total">0</div>
                <div class="mini-card-label">Avances registrados</div>
            </div>
            <div class="mini-card semana">
                <div class="mini-card-val" id="md-semana">0</div>
                <div class="mini-card-label">Últimos 7 días</div>
            </div>
            <div class="mini-card promedio">
                <div class="mini-card-val" id="md-promedio">0%</div>
                <div class="mini-card-label">Avance promedio (activos)</div>
            </div>
            <div class="mini-card atraso">
                <div class="mini-card-val" id="md-atrasados">0</div>
                <div class="mini-card-label">Reportes sin avance ≥5 días</div>
            </div>
        </div>

        <!-- ALERTA DE ATRASOS -->
        <div class="atrasos-panel" id="atrasos-panel">
            <div class="atrasos-head" onclick="document.getElementById('atrasos-panel').classList.toggle('colapsado')">
                <i class="ti ti-alert-triangle"></i>
                <span class="atrasos-head-title">Reportes que necesitan atención (sin avance reciente)</span>
                <i class="ti ti-chevron-down"></i>
            </div>
            <div class="atrasos-body" id="atrasos-body">
                <div class="atrasos-vacio">Cargando...</div>
            </div>
        </div>

        <!-- FILTROS -->
        <div class="filtros-bar">
            <label for="f-categoria">Categoría</label>
            <select id="f-categoria"><option value="todas">Todas</option></select>

            <label for="f-riesgo">Nivel</label>
            <select id="f-riesgo">
                <option value="todos">Todos</option>
                <option value="ALTO">Alto</option>
                <option value="MEDIO">Medio</option>
                <option value="BAJO">Bajo</option>
            </select>

            <label for="f-estado">Estado del reporte</label>
            <select id="f-estado">
                <option value="todos">Todos</option>
                <option value="pendiente">Pendiente</option>
                <option value="proceso">En proceso</option>
                <option value="resuelto">Resuelto</option>
                <option value="rechazado">Rechazado</option>
            </select>

            <label for="f-foto">Evidencia</label>
            <select id="f-foto">
                <option value="con-foto" selected>Solo con foto</option>
                <option value="todos">Con y sin foto</option>
            </select>

            <label for="f-orden">Orden</label>
            <select id="f-orden">
                <option value="reciente" selected>Más recientes</option>
                <option value="antiguo">Más antiguos</option>
                <option value="pct-desc">Mayor % avance</option>
                <option value="pct-asc">Menor % avance</option>
            </select>

            <button class="btn-reset-filtros" onclick="resetFiltros()">Limpiar filtros</button>
            <span class="filtros-resumen" id="filtros-resumen"></span>
        </div>

        <!-- GRID -->
        <div class="ev-grid" id="ev-grid">
            <div class="empty-state">
                <i class="ti ti-loader"></i>
                <p>Cargando evidencias...</p>
            </div>
        </div>
    </div>
</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">
    <button class="lightbox-close" onclick="cerrarLightbox()"><i class="ti ti-x"></i></button>
    <div class="lightbox-inner">
        <img class="lightbox-img" id="lb-img" src="" alt="evidencia">
        <div class="lightbox-body">
            <div class="lightbox-reporte" id="lb-reporte">—</div>
            <div class="lightbox-comentario" id="lb-comentario">Sin comentario.</div>
            <div class="lightbox-meta">
                <span id="lb-usuario"><i class="ti ti-user"></i> —</span>
                <span id="lb-fecha"><i class="ti ti-calendar"></i> —</span>
                <span id="lb-avance"><i class="ti ti-chart-bar"></i> —% avance</span>
                <span id="lb-estado"><i class="ti ti-flag"></i> —</span>
            </div>
        </div>
    </div>
</div>
<script src="/js/admin-guard.js"></script>
<script>
    // Guard
    const TOKEN = window.ADMIN_TOKEN;

    function formatFecha(f) {
      if (!f) return '—';
      return new Date(f).toLocaleDateString('es-PE', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    }
    function badgeRiesgoClase(r) { return (r || '').toLowerCase(); }

    let TODOS = [];          // todos los avances tal cual vienen del backend
    let mostrados = [];      // resultado filtrado actualmente mostrado (referenciado por el lightbox)

    async function cargarResumen() {
      try {
        const res  = await fetch('/api/admin/evidencias/resumen', { headers: { 'Authorization': 'Bearer ' + TOKEN } });
        const json = await res.json();
        const r = json.data || {};
        document.getElementById('md-total').textContent     = r.totalAvances ?? 0;
        document.getElementById('md-semana').textContent    = r.avancesUltimos7Dias ?? 0;
        document.getElementById('md-promedio').textContent  = (r.promedioPorcentajeActivos ?? 0) + '%';
        const atrasados = r.reportesAtrasados || [];
        document.getElementById('md-atrasados').textContent = atrasados.length;
        renderAtrasos(atrasados);
      } catch {
        document.getElementById('atrasos-body').innerHTML =
          '<div class="atrasos-vacio">No se pudo cargar el resumen de avances.</div>';
      }
    }

    function renderAtrasos(lista) {
      const body = document.getElementById('atrasos-body');
      if (lista.length === 0) {
        body.innerHTML = '<div class="atrasos-vacio">Ningún reporte activo está atrasado. Todo al día. 👍</div>';
        return;
      }
      body.innerHTML = lista.map(r => `
        <div class="atraso-row">
          <div class="atraso-dias">${r.diasSinAvance}d sin avance</div>
          <div class="atraso-info">
            <div class="atraso-tit">#${r.reporteId} — ${r.titulo}</div>
            <div class="atraso-meta">${r.categoria || '—'} · ${(r.nivelRiesgo || '').toUpperCase()} · ${r.zonaReferencia || 'Sin zona'} · ${r.estado}</div>
          </div>
          <div class="atraso-pct">${r.porcentajeAvance}%</div>
        </div>
      `).join('');
    }

    function poblarCategorias() {
      const sel = document.getElementById('f-categoria');
      const cats = [...new Set(TODOS.map(a => a.categoria).filter(Boolean))].sort();
      cats.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c; opt.textContent = c;
        sel.appendChild(opt);
      });
    }

    function aplicarFiltrosYOrden() {
      const fCat    = document.getElementById('f-categoria').value;
      const fRiesgo = document.getElementById('f-riesgo').value;
      const fEstado = document.getElementById('f-estado').value;
      const fFoto   = document.getElementById('f-foto').value;
      const fOrden  = document.getElementById('f-orden').value;

      let lista = TODOS.filter(a => {
        const pasaCat    = fCat === 'todas' || a.categoria === fCat;
        const pasaRiesgo = fRiesgo === 'todos' || (a.nivelRiesgo || '').toUpperCase() === fRiesgo;
        const estado = (a.estadoReporte || '').toLowerCase();
        const pasaEstado = fEstado === 'todos' || estado.includes(fEstado);
        const pasaFoto = fFoto === 'todos' || (a.urlFoto && a.urlFoto.trim() !== '');
        return pasaCat && pasaRiesgo && pasaEstado && pasaFoto;
      });

      lista.sort((a, b) => {
        if (fOrden === 'reciente') return new Date(b.fecha) - new Date(a.fecha);
        if (fOrden === 'antiguo')  return new Date(a.fecha) - new Date(b.fecha);
        if (fOrden === 'pct-desc') return b.porcentaje - a.porcentaje;
        if (fOrden === 'pct-asc')  return a.porcentaje - b.porcentaje;
        return 0;
      });

      return lista;
    }

    function renderGrid() {
      const grid = document.getElementById('ev-grid');
      const lista = aplicarFiltrosYOrden();
      mostrados = lista;

      document.getElementById('filtros-resumen').textContent =
        `Mostrando ${lista.length} de ${TODOS.length} avances`;

      if (lista.length === 0) {
        grid.innerHTML = `
          <div class="empty-state">
            <i class="ti ti-photo-off"></i>
            <p>No hay avances que coincidan con los filtros seleccionados.</p>
          </div>`;
        return;
      }

      grid.innerHTML = lista.map((e, i) => `
        <div class="ev-card" onclick="abrirLightbox(${i})">
          <div class="ev-foto-wrap">
            ${e.urlFoto
              ? `<img class="ev-foto" src="${e.urlFoto}" alt="evidencia"
                   onerror="this.parentElement.innerHTML='<div class=ev-foto-placeholder><i class=ti ti-photo></i></div>'">`
              : `<div class="ev-foto-placeholder"><i class="ti ti-photo-off"></i></div>`}
            <div class="ev-riesgo ${badgeRiesgoClase(e.nivelRiesgo)}">${(e.nivelRiesgo || '—').toUpperCase()}</div>
            <div class="ev-porcentaje"><i class="ti ti-chart-bar" style="font-size:.65rem"></i> ${e.porcentaje ?? 0}%</div>
          </div>
          <div class="ev-body">
            <div class="ev-reporte"><span>Reporte #${e.reporteId ?? '—'}</span><span>${e.categoria || ''}</span></div>
            <div class="ev-comentario">${e.comentario || 'Sin comentario registrado.'}</div>
          </div>
          <div class="ev-footer">
            <div class="ev-user"><i class="ti ti-user"></i>${e.nombreUsuario || '—'}</div>
            <div class="ev-fecha">${formatFecha(e.fecha)}</div>
          </div>
        </div>
      `).join('');
    }

    async function cargarEvidencias() {
      try {
        const res  = await fetch('/api/admin/evidencias', { headers: { 'Authorization': 'Bearer ' + TOKEN } });
        const json = await res.json();
        TODOS = json.data || [];
        poblarCategorias();
        renderGrid();
      } catch {
        document.getElementById('ev-grid').innerHTML = `
          <div class="empty-state">
            <i class="ti ti-wifi-off"></i>
            <p>Error al cargar las evidencias.</p>
          </div>`;
      }
    }

    ['f-categoria', 'f-riesgo', 'f-estado', 'f-foto', 'f-orden'].forEach(id => {
      document.getElementById(id).addEventListener('change', renderGrid);
    });

    function resetFiltros() {
      document.getElementById('f-categoria').value = 'todas';
      document.getElementById('f-riesgo').value = 'todos';
      document.getElementById('f-estado').value = 'todos';
      document.getElementById('f-foto').value = 'con-foto';
      document.getElementById('f-orden').value = 'reciente';
      renderGrid();
    }

    // ── Lightbox ───────────────────────────────────────────────────
    function abrirLightbox(idx) {
      const e = mostrados[idx];
      if (!e) return;
      document.getElementById('lb-img').src = e.urlFoto || '';
      document.getElementById('lb-img').style.display = e.urlFoto ? 'block' : 'none';
      document.getElementById('lb-reporte').textContent    = `Reporte #${e.reporteId ?? '—'} — ${e.reporteTitulo || ''}`;
      document.getElementById('lb-comentario').textContent = e.comentario || 'Sin comentario registrado.';
      document.getElementById('lb-usuario').innerHTML = `<i class="ti ti-user"></i> ${e.nombreUsuario || '—'}`;
      document.getElementById('lb-fecha').innerHTML   = `<i class="ti ti-calendar"></i> ${formatFecha(e.fecha)}`;
      document.getElementById('lb-avance').innerHTML  = `<i class="ti ti-chart-bar"></i> ${e.porcentaje ?? 0}% avance`;
      document.getElementById('lb-estado').innerHTML  = `<i class="ti ti-flag"></i> ${e.estadoReporte || '—'}`;
      document.getElementById('lightbox').classList.add('open');
    }
    function cerrarLightbox() {
      document.getElementById('lightbox').classList.remove('open');
    }
    document.addEventListener('keydown', e => { if (e.key === 'Escape') cerrarLightbox(); });
    document.getElementById('lightbox').addEventListener('click', e => {
