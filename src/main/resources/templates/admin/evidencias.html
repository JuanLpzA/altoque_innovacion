<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Altoque – Evidencias</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
          --sidebar-bg: #1a3a8f;
          --accent: #0fa89a;
          --bg: #f0f5fb;
          --card: #fff;
          --text: #111827;
          --muted: #9ca3af;
          --border: #f3f4f6;
        }

        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); min-height: 100vh; display: flex; }

        .sidebar { width: 220px; background: var(--sidebar-bg); min-height: 100vh; display: flex; flex-direction: column; flex-shrink: 0; position: sticky; top: 0; height: 100vh; }
        .sidebar-brand { padding: 1.4rem 1.4rem .9rem; font-size: 1.3rem; font-weight: 900; color: #fff; letter-spacing: -.02em; border-bottom: 1px solid rgba(255,255,255,.08); }
        .sidebar-brand span { color: var(--accent); }
        .sidebar-section { padding: .9rem 1.4rem .3rem; font-size: .62rem; font-weight: 700; color: rgba(255,255,255,.3); text-transform: uppercase; letter-spacing: .1em; }
        .sidebar-nav a { display: flex; align-items: center; gap: .65rem; padding: .62rem 1.4rem; color: rgba(255,255,255,.62); text-decoration: none; font-size: .84rem; font-weight: 500; transition: background .15s, color .15s; }
        .sidebar-nav a:hover { background: rgba(255,255,255,.07); color: #fff; }
        .sidebar-nav a.active { background: rgba(255,255,255,.13); color: #fff; border-right: 3px solid var(--accent); }
        .sidebar-nav a i { font-size: 1.05rem; opacity: .85; }
        .sidebar-footer { margin-top: auto; padding: 1rem 1.4rem; border-top: 1px solid rgba(255,255,255,.08); }
        .sidebar-user { display: flex; align-items: center; gap: .6rem; }
        .avatar-sm { width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,.13); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .avatar-sm i { color: #fff; font-size: .95rem; }
        .user-info { flex: 1; min-width: 0; }
        .user-name { color: #fff; font-weight: 600; font-size: .78rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .user-role { color: rgba(255,255,255,.4); font-size: .67rem; }
        .btn-logout { background: none; border: none; color: rgba(255,255,255,.4); cursor: pointer; font-size: 1rem; padding: .2rem; transition: color .15s; }
        .btn-logout:hover { color: #fff; }

        .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
        .topbar { background: var(--card); padding: .9rem 1.8rem; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; }
        .topbar-title { font-size: 1rem; font-weight: 700; color: var(--text); }
        .content { padding: 1.6rem 1.8rem; }

        /* ── GRID EVIDENCIAS ── */
        .ev-grid {
          display: grid;
          grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
          gap: 1rem;
        }

        .ev-card {
          background: var(--card);
          border-radius: 14px;
          box-shadow: 0 2px 10px rgba(0,0,0,.05);
          overflow: hidden;
          transition: box-shadow .2s, transform .2s;
          cursor: pointer;
        }

        .ev-card:hover { box-shadow: 0 6px 24px rgba(0,0,0,.1); transform: translateY(-2px); }

        .ev-foto-wrap { position: relative; height: 180px; background: #f3f4f6; overflow: hidden; }

        .ev-foto {
          width: 100%;
          height: 100%;
          object-fit: cover;
          transition: transform .3s;
        }

        .ev-card:hover .ev-foto { transform: scale(1.04); }

        .ev-foto-placeholder {
          width: 100%; height: 100%;
          display: flex; align-items: center; justify-content: center;
        }

        .ev-foto-placeholder i { font-size: 2.5rem; color: #d1d5db; }

        .ev-porcentaje {
          position: absolute;
          top: .6rem; right: .6rem;
          background: rgba(0,0,0,.65);
          color: #fff;
          font-size: .7rem;
          font-weight: 700;
          padding: .2rem .55rem;
          border-radius: 99px;
          display: flex; align-items: center; gap: .3rem;
        }

        .ev-body { padding: .9rem 1rem; }
        .ev-reporte { font-size: .68rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-bottom: .3rem; }
        .ev-comentario { font-size: .82rem; color: #374151; line-height: 1.5;
          display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .ev-footer { padding: .65rem 1rem; border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
        .ev-user { display: flex; align-items: center; gap: .35rem; font-size: .72rem; color: #374151; font-weight: 500; }
        .ev-user i { color: var(--muted); font-size: .8rem; }
        .ev-fecha { font-size: .68rem; color: var(--muted); }

        .empty-state { text-align: center; padding: 4rem 2rem; color: var(--muted); grid-column: 1/-1; }
        .empty-state i { font-size: 3rem; margin-bottom: 1rem; display: block; opacity: .4; }
        .empty-state p { font-size: .88rem; }

        /* ── LIGHTBOX ── */
        .lightbox {
          position: fixed; inset: 0;
          background: rgba(0,0,0,.88);
          display: none;
          align-items: center; justify-content: center;
          z-index: 200;
          padding: 1.5rem;
        }

        .lightbox.open { display: flex; }

        .lightbox-inner {
          max-width: 760px;
          width: 100%;
          background: var(--card);
          border-radius: 16px;
          overflow: hidden;
          display: flex;
          flex-direction: column;
          max-height: 90vh;
        }

        .lightbox-img { width: 100%; max-height: 420px; object-fit: contain; background: #111; }
        .lightbox-body { padding: 1.2rem 1.4rem; overflow-y: auto; }
        .lightbox-reporte { font-size: .72rem; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; margin-bottom: .4rem; }
        .lightbox-comentario { font-size: .9rem; color: var(--text); line-height: 1.65; margin-bottom: .8rem; }
        .lightbox-meta { display: flex; gap: 1.2rem; font-size: .78rem; color: var(--muted); }
        .lightbox-close {
          position: absolute; top: 1rem; right: 1rem;
          background: rgba(255,255,255,.12);
          border: none; border-radius: 50%;
          width: 36px; height: 36px;
          display: flex; align-items: center; justify-content: center;
          cursor: pointer; color: #fff; font-size: 1.1rem;
          transition: background .15s;
        }
        .lightbox-close:hover { background: rgba(255,255,255,.2); }
    </style>
</head>
<body>

<!-- SIDEBAR -->
<div class="sidebar">
    <div class="sidebar-brand">AL<span>Toque</span></div>
    <div class="sidebar-section">Principal</div>
    <nav class="sidebar-nav">
        <a href="/admin/dashboard"><i class="ti ti-layout-dashboard"></i> Dashboard</a>
        <a href="/admin/reportes"><i class="ti ti-clipboard-list"></i> Reportes</a>
        <a href="/admin/mapa"><i class="ti ti-map-pin"></i> Mapa de incidencias</a>
        <a href="/admin/evidencias" class="active"><i class="ti ti-photo"></i> Evidencias</a>
        <a href="/admin/moderacion"><i class="ti ti-shield-check"></i> Centro de moderación</a>
    </nav>
    <div class="sidebar-footer">
        <div class="sidebar-user">
            <div class="avatar-sm"><i class="ti ti-building-community"></i></div>
            <div class="user-info">
                <div class="user-name" id="sb-nombre">—</div>
                <div class="user-role">Municipalidad</div>
            </div>
            <button class="btn-logout" onclick="cerrarSesion()"><i class="ti ti-power"></i></button>
        </div>
    </div>
</div>

<!-- MAIN -->
<div class="main">
    <div class="topbar">
        <div class="topbar-title">Evidencias registradas</div>
    </div>

    <div class="content">
        <div class="ev-grid" id="ev-grid">
            <div class="empty-state">
                <i class="ti ti-loader"></i>
                <p>Cargando evidencias...</p>
            </div>
        </div>
    </div>
</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">
    <button class="lightbox-close" onclick="cerrarLightbox()"><i class="ti ti-x"></i></button>
    <div class="lightbox-inner">
        <img class="lightbox-img" id="lb-img" src="" alt="evidencia">
        <div class="lightbox-body">
            <div class="lightbox-reporte" id="lb-reporte">—</div>
            <div class="lightbox-comentario" id="lb-comentario">Sin comentario.</div>
            <div class="lightbox-meta">
                <span id="lb-usuario"><i class="ti ti-user"></i> —</span>
                <span id="lb-fecha"><i class="ti ti-calendar"></i> —</span>
                <span id="lb-avance"><i class="ti ti-chart-bar"></i> —% avance</span>
            </div>
        </div>
    </div>
</div>

<script>
    // Guard
    (function () {
      if (!localStorage.getItem('token') || localStorage.getItem('rol') !== 'municipalidad')
        window.location.href = '/';
    })();

    const TOKEN = localStorage.getItem('token');
    document.getElementById('sb-nombre').textContent =
      (localStorage.getItem('nombre') || '') + ' ' + (localStorage.getItem('apellido') || '');

    function formatFecha(f) {
      if (!f) return '—';
      return new Date(f).toLocaleDateString('es-PE', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    let evidenciasData = [];

    function renderGrid(evidencias) {
      const grid = document.getElementById('ev-grid');

      const conFoto = evidencias.filter(e => e.urlFoto && e.urlFoto.trim() !== '');

      if (conFoto.length === 0) {
        grid.innerHTML = `
          <div class="empty-state">
            <i class="ti ti-photo-off"></i>
            <p>Aún no hay evidencias fotográficas registradas.</p>
          </div>`;
        return;
      }

      grid.innerHTML = conFoto.map((e, i) => `
        <div class="ev-card" onclick="abrirLightbox(${i})">
          <div class="ev-foto-wrap">
            <img class="ev-foto" src="${e.urlFoto}" alt="evidencia"
              onerror="this.parentElement.innerHTML='<div class=ev-foto-placeholder><i class=ti ti-photo></i></div>'">
            <div class="ev-porcentaje"><i class="ti ti-chart-bar" style="font-size:.65rem"></i> ${e.porcentaje ?? 0}%</div>
          </div>
          <div class="ev-body">
            <div class="ev-reporte">Reporte #${e.reporteId ?? '—'}</div>
            <div class="ev-comentario">${e.comentario || 'Sin comentario registrado.'}</div>
          </div>
          <div class="ev-footer">
            <div class="ev-user"><i class="ti ti-user"></i>${e.nombreUsuario || '—'}</div>
            <div class="ev-fecha">${formatFecha(e.fecha)}</div>
          </div>
        </div>
      `).join('');

      evidenciasData = conFoto;
    }

    async function cargarEvidencias() {
      try {
        const res  = await fetch('/api/admin/reportes', {
          headers: { 'Authorization': 'Bearer ' + TOKEN }
        });
        const json = await res.json();
        const reportes = json.data || [];

        // Obtener avances de cada reporte que tenga avances con foto
        const avancesConFoto = [];
        for (const r of reportes) {
          if (!r.avances) continue;
          for (const a of r.avances) {
            if (a.urlFoto) {
              avancesConFoto.push({
                ...a,
                reporteId: r.id,
                nombreUsuario: a.nombreUsuario
              });
            }
          }
        }

        // Ordenar por fecha descendente
        avancesConFoto.sort((a, b) => new Date(b.fecha) - new Date(a.fecha));

        renderGrid(avancesConFoto);
      } catch {
        document.getElementById('ev-grid').innerHTML = `
          <div class="empty-state">
            <i class="ti ti-wifi-off"></i>
            <p>Error al cargar las evidencias.</p>
          </div>`;
      }
    }

    // ── Lightbox ───────────────────────────────────────────────────
    function abrirLightbox(idx) {
      const e = evidenciasData[idx];
      if (!e) return;

      document.getElementById('lb-img').src          = e.urlFoto || '';
      document.getElementById('lb-reporte').textContent   = `Reporte #${e.reporteId ?? '—'}`;
      document.getElementById('lb-comentario').textContent = e.comentario || 'Sin comentario registrado.';
      document.getElementById('lb-usuario').innerHTML = `<i class="ti ti-user"></i> ${e.nombreUsuario || '—'}`;
      document.getElementById('lb-fecha').innerHTML   = `<i class="ti ti-calendar"></i> ${formatFecha(e.fecha)}`;
      document.getElementById('lb-avance').innerHTML  = `<i class="ti ti-chart-bar"></i> ${e.porcentaje ?? 0}% avance`;

      document.getElementById('lightbox').classList.add('open');
    }

    function cerrarLightbox() {
      document.getElementById('lightbox').classList.remove('open');
    }

    document.addEventListener('keydown', e => { if (e.key === 'Escape') cerrarLightbox(); });
    document.getElementById('lightbox').addEventListener('click', e => {
      if (e.target === e.currentTarget) cerrarLightbox();
    });

    async function cerrarSesion() {
      try { await fetch('/api/auth/logout', { method: 'POST', headers: { 'Authorization': 'Bearer ' + TOKEN } }); }
      finally { localStorage.clear(); window.location.href = '/'; }
    }

    cargarEvidencias();
</script>
</body>
</html>
