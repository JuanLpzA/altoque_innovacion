<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Altoque – Mis reportes</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f0f5fb;
            min-height: 100dvh;
            padding-bottom: 80px;
            max-width: 480px;
            margin: 0 auto;
        }

        /* ── HEADER igual que inicio ── */
        .header {
            background: #1a3a8f;
            padding: 1.1rem 1.2rem 1.3rem;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: .75rem;
        }

        .back-btn {
            width: 38px; height: 38px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,.35);
            background: transparent;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            color: #fff;
            font-size: 1.1rem;
            text-decoration: none;
            flex-shrink: 0;
        }

        .header-title {
            font-size: 1.2rem;
            font-weight: 800;
            color: #fff;
            letter-spacing: -.01em;
        }

        .header-sub {
            font-size: .72rem;
            color: rgba(255,255,255,.7);
            margin-top: 2px;
        }

        .icon-btn {
            width: 38px; height: 38px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,.35);
            background: transparent;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            color: #fff;
            font-size: 1.05rem;
        }

        /* ── LISTA ── */
        .lista { padding: 1rem; }

        /* ── TARJETA REPORTE ── */
        .reporte-card {
            background: #fff;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: .85rem;
            box-shadow: 0 2px 14px rgba(0,0,0,.07);
        }

        .reporte-img-wrap {
            position: relative;
            width: 100%;
            height: 130px;
        }

        .reporte-img {
            width: 100%; height: 100%;
            object-fit: cover; display: block;
        }

        .reporte-img-placeholder {
            width: 100%; height: 100%;
            background: linear-gradient(135deg, #c8d8ec, #a8bdd8);
            display: flex; align-items: center; justify-content: center;
            color: #7a97b8; font-size: 2.2rem;
        }

        /* Badge estado sobre imagen */
        .badge-img {
            position: absolute;
            top: 10px; right: 10px;
            font-size: .68rem;
            font-weight: 700;
            padding: .25rem .65rem;
            border-radius: 99px;
        }

        .badge-PENDIENTE  { background: rgba(239,68,68,.85);  color: #fff; }
        .badge-EN_PROCESO { background: rgba(59,130,246,.85); color: #fff; }
        .badge-RESUELTO   { background: rgba(34,197,94,.85);  color: #fff; }
        .badge-default    { background: rgba(107,114,128,.8); color: #fff; }

        /* Badge nivel riesgo inline */
        .badge-riesgo {
            font-size: .62rem;
            font-weight: 700;
            padding: .18rem .5rem;
            border-radius: 99px;
        }
        .badge-ALTO  { background: #fef2f2; color: #b91c1c; }
        .badge-MEDIO { background: #fffbeb; color: #b45309; }
        .badge-BAJO  { background: #f0fdf4; color: #15803d; }

        .reporte-body { padding: .85rem .9rem .9rem; }

        .reporte-cat {
            font-size: .7rem;
            font-weight: 700;
            color: #1a3a8f;
            text-transform: uppercase;
            letter-spacing: .04em;
            margin-bottom: .3rem;
            display: flex;
            align-items: center;
            gap: .4rem;
        }

        .reporte-titulo {
            font-size: .95rem;
            font-weight: 700;
            color: #111827;
            margin-bottom: .35rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .reporte-desc {
            font-size: .78rem;
            color: #6b7280;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: .45rem;
        }

        .reporte-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: .35rem;
        }

        .reporte-dir {
            display: flex;
            align-items: center;
            gap: .3rem;
            font-size: .72rem;
            color: #9ca3af;
        }

        .reporte-dir i { color: #ef4444; font-size: 13px; }

        .reporte-fecha {
            font-size: .7rem;
            color: #9ca3af;
        }

        .empty {
            text-align: center;
            color: #9ca3af;
            padding: 3rem 1rem;
            font-size: .9rem;
            line-height: 1.6;
        }

        .empty a { color: #1a3a8f; font-weight: 700; text-decoration: none; }

        /* ── NAV INFERIOR igual que inicio ── */
        nav {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            max-width: 480px;
            margin: 0 auto;
            background: #fff;
            border-top: 1px solid #e5e7eb;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: .45rem 0 .75rem;
            z-index: 10;
        }

        nav a {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: .1rem;
            font-size: .62rem;
            font-weight: 600;
            color: #9ca3af;
            text-decoration: none;
        }

        nav a.activo { color: #1a3a8f; }
        nav a i { font-size: 1.35rem; }

        .nav-center {
            background: #1a3a8f;
            width: 54px; height: 54px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin-top: -22px;
            border: 3px solid #fff;
            box-shadow: 0 4px 16px rgba(26,58,143,.35);
            text-decoration: none;
        }

        .nav-center i { color: #fff; font-size: 1.5rem; }
    </style>
</head>
<body>

<!-- ── HEADER ── -->
<div class="header">
    <div class="header-top">
        <div class="header-left">
            <a href="/inicio" class="back-btn" aria-label="Volver">
                <i class="ti ti-arrow-left"></i>
            </a>
            <div>
                <div class="header-title">Mis Reportes</div>
                <div class="header-sub" id="hdr-sub">Historial de incidencias</div>
            </div>
        </div>
        <button class="icon-btn" aria-label="Cerrar sesión" onclick="ejecutarCerrarSesion()">
            <i class="ti ti-power"></i>
        </button>
    </div>
</div>

<!-- ── LISTA ── -->
<div class="lista" id="lista">
    <p class="empty">Cargando...</p>
</div>

<!-- ── NAV INFERIOR ── -->
<nav>
    <a href="/inicio" class="activo">
        <i class="ti ti-home"></i>
        <span>Inicio</span>
    </a>
    <a href="/nuevo-reporte">
        <div class="nav-center">
            <i class="ti ti-plus"></i>
        </div>
    </a>
    <a href="#">
        <i class="ti ti-user"></i>
        <span>Perfil</span>
    </a>
    <!--    <a href="/mis-reportes" class="activo">-->
    <!--        <i class="ti ti-clipboard-list"></i>-->
    <!--        <span>Mis reportes</span>-->
    <!--    </a>-->
</nav>

<script>
    const token = localStorage.getItem('token');
    if (!token) window.location.href = '/login';

    function formatFecha(iso) {
        if (!iso) return '';
        const d = new Date(iso);
        return d.toLocaleDateString('es-PE', { day: '2-digit', month: 'short', year: 'numeric' });
    }

    function estadoBadgeClass(nombre) {
        if (!nombre) return 'badge-default';
        const n = nombre.toUpperCase();
        if (n.includes('PENDIENTE')) return 'badge-PENDIENTE';
        if (n.includes('PROCESO') || n.includes('PROGRESO')) return 'badge-EN_PROCESO';
        if (n.includes('RESUELTO')) return 'badge-RESUELTO';
        return 'badge-default';
    }

    fetch('/api/mini-reportes/mis', {
        headers: { 'Authorization': 'Bearer ' + token }
    })
    .then(r => r.json())
    .then(json => {
        const lista = document.getElementById('lista');
        if (!json.data || json.data.length === 0) {
            lista.innerHTML = `<p class="empty">Aún no has enviado ningún reporte.<br>
                <a href="/nuevo-reporte">Enviar mi primer reporte →</a></p>`;
            return;
        }
        document.getElementById('hdr-sub').textContent =
            json.data.length + (json.data.length === 1 ? ' reporte enviado' : ' reportes enviados');

        lista.innerHTML = json.data.map(r => {
            const badgeCls = estadoBadgeClass(r.estado || '');
            const imgHtml = r.urlFoto
                ? `<img class="reporte-img" src="${r.urlFoto}" alt="${r.titulo}">`
                : `<div class="reporte-img-placeholder"><i class="ti ti-photo"></i></div>`;
            const estadoLabel = r.estado || '';
            const nivelHtml = r.nivelRiesgo
                ? `<span class="badge-riesgo badge-${r.nivelRiesgo}">${r.nivelRiesgo}</span>` : '';
            return `
            <div class="reporte-card">
                <div class="reporte-img-wrap">
                    ${imgHtml}
                    ${estadoLabel ? `<span class="badge-img ${badgeCls}">${estadoLabel}</span>` : ''}
                </div>
                <div class="reporte-body">
                    <div class="reporte-cat">
                        ${r.categoria || ''} ${nivelHtml}
                    </div>
                    <div class="reporte-titulo">${r.titulo}</div>
                    <div class="reporte-desc">${r.descripcion || ''}</div>
                    <div class="reporte-footer">
                        <div class="reporte-dir">
                            <i class="ti ti-map-pin"></i>
                            <span>${r.direccionAprox || 'Sin dirección'}</span>
                        </div>
                        <span class="reporte-fecha">${formatFecha(r.fechaCreacion)}</span>
                    </div>
                </div>
            </div>`;
        }).join('');
    })
    .catch(() => {
        document.getElementById('lista').innerHTML =
            '<p class="empty">Error al cargar tus reportes.</p>';
    });

    async function ejecutarCerrarSesion() {
        try {
            const t = localStorage.getItem('token');
            if (t) {
                await fetch('/api/auth/logout', {
                    method: 'POST',
                    headers: { 'Authorization': 'Bearer ' + t }
                });
            }
        } catch (e) {
            console.error("Error al notificar al servidor:", e);
        } finally {
            localStorage.clear();
            window.location.href = '/login';
        }
    }
</script>
</body>
</html>
