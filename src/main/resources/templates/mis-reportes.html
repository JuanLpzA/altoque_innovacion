<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Altoque – Mis reportes</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f0f5fb;
            min-height: 100dvh;
            padding-bottom: 80px;
            max-width: 480px;
            margin: 0 auto;
        }
        /* ── HEADER ── */
        .header { background: #1a3a8f; padding: 1.1rem 1.2rem 1.3rem; }
        .header-top { display: flex; justify-content: space-between; align-items: center; }
        .header-left { display: flex; align-items: center; gap: .75rem; }
        .back-btn {
            width: 38px; height: 38px; border-radius: 50%;
            border: 2px solid rgba(255,255,255,.35); background: transparent;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: #fff; font-size: 1.1rem; text-decoration: none; flex-shrink: 0;
        }
        .header-title { font-size: 1.2rem; font-weight: 800; color: #fff; letter-spacing: -.01em; }
        .header-sub { font-size: .72rem; color: rgba(255,255,255,.7); margin-top: 2px; }
        .icon-btn {
            width: 38px; height: 38px; border-radius: 50%;
            border: 2px solid rgba(255,255,255,.35); background: transparent;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: #fff; font-size: 1.05rem;
        }
        /* ── TABS ── */
        .tabs {
            display: flex; margin: 1rem 1rem .3rem; background: #fff;
            border-radius: 12px; padding: .3rem; box-shadow: 0 2px 10px rgba(0,0,0,.06);
        }
        .tab-btn {
            flex: 1; padding: .6rem .5rem; border: none; background: transparent;
            border-radius: 9px; font-size: .78rem; font-weight: 700; color: #9ca3af;
            cursor: pointer; display: flex; align-items: center; justify-content: center; gap: .4rem;
        }
        .tab-btn.activo { background: #1a3a8f; color: #fff; }
        .tab-btn i { font-size: 1rem; }
        .tab-panel { display: none; }
        .tab-panel.activo { display: block; }
        /* ── LISTA ── */
        .lista { padding: .6rem 1rem 1rem; }
        /* ── TARJETA CASO (reportes consolidados) ── */
        .caso-card {
            background: #fff; border-radius: 16px; overflow: hidden; margin-bottom: .85rem;
            box-shadow: 0 2px 14px rgba(0,0,0,.07); text-decoration: none; display: block;
        }
        .caso-img-wrap { position: relative; width: 100%; height: 150px; }
        .caso-img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .caso-img-placeholder {
            width: 100%; height: 100%; background: linear-gradient(135deg, #c8d8ec, #a8bdd8);
            display: flex; align-items: center; justify-content: center; color: #7a97b8; font-size: 2rem;
        }
        .badge-img {
            position: absolute; top: 10px; right: 10px; font-size: .68rem; font-weight: 700;
            padding: .25rem .65rem; border-radius: 99px; backdrop-filter: blur(4px);
        }
        .badge-PENDIENTE  { background: rgba(239,68,68,.85);  color: #fff; }
        .badge-EN_PROCESO { background: rgba(59,130,246,.85); color: #fff; }
        .badge-RESUELTO   { background: rgba(34,197,94,.85);  color: #fff; }
        .badge-default    { background: rgba(107,114,128,.8); color: #fff; }
        .badge-riesgo { font-size: .62rem; font-weight: 700; padding: .18rem .5rem; border-radius: 99px; }
        .badge-ALTO  { background: #fef2f2; color: #b91c1c; }
        .badge-MEDIO { background: #fffbeb; color: #b45309; }
        .badge-BAJO  { background: #f0fdf4; color: #15803d; }
        .caso-body { padding: .85rem .9rem .9rem; }
        .caso-cat { font-size: .7rem; font-weight: 700; color: #1a3a8f; text-transform: uppercase; letter-spacing: .04em; margin-bottom: .3rem; display: flex; align-items: center; gap: .4rem; }
        .caso-titulo { font-size: .95rem; font-weight: 700; color: #111827; margin-bottom: .5rem; }
        .caso-progreso-wrap { margin-bottom: .55rem; }
        .caso-progreso-label { display: flex; justify-content: space-between; font-size: .68rem; color: #9ca3af; margin-bottom: .25rem; }
        .progress-bar { background: #e5e7eb; border-radius: 99px; height: 6px; overflow: hidden; }
        .progress-fill { background: #0fa89a; height: 100%; border-radius: 99px; }
        .caso-footer { display: flex; justify-content: space-between; align-items: center; margin-top: .4rem; }
        .caso-personas { display: flex; align-items: center; gap: .3rem; font-size: .72rem; color: #6b7280; font-weight: 600; }
        .caso-personas i { font-size: .95rem; color: #1a3a8f; }
        .ver-detalle { font-size: .73rem; font-weight: 700; color: #1a3a8f; }
        /* ── TARJETA ENVÍO (individual) ── */
        .envio-card {
            background: #fff; border-radius: 16px; overflow: hidden; margin-bottom: .8rem;
            box-shadow: 0 2px 12px rgba(0,0,0,.06); display: flex; text-decoration: none;
        }
        .envio-img { width: 96px; height: 96px; object-fit: cover; flex-shrink: 0; }
        .envio-img-placeholder {
            width: 96px; height: 96px; flex-shrink: 0; background: linear-gradient(135deg, #c8d8ec, #a8bdd8);
            display: flex; align-items: center; justify-content: center; color: #7a97b8; font-size: 1.5rem;
        }
        .envio-body { padding: .7rem .8rem; flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: .3rem; }
        .envio-titulo { font-size: .86rem; font-weight: 700; color: #111827; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .envio-cat { font-size: .68rem; color: #9ca3af; font-weight: 600; }
        .envio-estado {
            display: inline-flex; align-items: center; gap: .25rem; width: fit-content;
            font-size: .66rem; font-weight: 700; padding: .2rem .5rem; border-radius: 99px; margin-top: .1rem;
        }
        .envio-estado.pendiente-caso { background: #fffbeb; color: #b45309; }
        .envio-estado.en-caso { background: #eff6ff; color: #1d4ed8; }
        .envio-fecha { font-size: .65rem; color: #9ca3af; margin-top: .1rem; }
        /* ── EMPTY / SKELETON ── */
        .empty { text-align: center; color: #9ca3af; padding: 3rem 1rem; font-size: .9rem; line-height: 1.6; }
        .empty a { color: #1a3a8f; font-weight: 700; text-decoration: none; }
        .skeleton { background: linear-gradient(90deg, #e5e7eb 25%, #f3f4f6 50%, #e5e7eb 75%); background-size: 200% 100%; animation: shimmer 1.2s infinite; border-radius: 12px; }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        .skeleton-caso { height: 220px; margin-bottom: .85rem; }
        .skeleton-envio { height: 96px; margin-bottom: .8rem; }
        /* ── NAV INFERIOR ── */
        nav {
            position: fixed; bottom: 0; left: 0; right: 0; max-width: 480px; margin: 0 auto;
            background: #fff; border-top: 1px solid #e5e7eb;
            display: flex; justify-content: space-around; align-items: center; padding: .45rem 0 .75rem; z-index: 10;
        }
        nav a { display: flex; flex-direction: column; align-items: center; gap: .1rem; font-size: .62rem; font-weight: 600; color: #9ca3af; text-decoration: none; }
        nav a.activo { color: #1a3a8f; }
        nav a i { font-size: 1.35rem; }
        .nav-center {
            background: #1a3a8f; width: 54px; height: 54px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; margin-top: -22px;
            border: 3px solid #fff; box-shadow: 0 4px 16px rgba(26,58,143,.35); text-decoration: none;
        }
        .nav-center i { color: #fff; font-size: 1.5rem; }
    </style>
</head>
<body>
<!-- ── HEADER ── -->
<div class="header">
    <div class="header-top">
        <div class="header-left">
            <a href="/inicio" class="back-btn" aria-label="Volver"><i class="ti ti-arrow-left"></i></a>
            <div>
                <div class="header-title">Mis reportes</div>
                <div class="header-sub" id="hdr-sub">Cargando...</div>
            </div>
        </div>
        <button class="icon-btn" aria-label="Cerrar sesión" onclick="ejecutarCerrarSesion()">
            <i class="ti ti-power"></i>
        </button>
    </div>
</div>

<!-- ── TABS ── -->
<div class="tabs">
    <button class="tab-btn activo" id="tab-casos" onclick="cambiarTab('casos')">
        <i class="ti ti-building-community"></i> Casos municipales
    </button>
    <button class="tab-btn" id="tab-envios" onclick="cambiarTab('envios')">
        <i class="ti ti-send"></i> Tus envíos
    </button>
</div>

<!-- PANEL: CASOS -->
<div class="tab-panel activo" id="panel-casos">
    <div class="lista" id="lista-casos">
        <div class="skeleton skeleton-caso"></div>
        <div class="skeleton skeleton-caso"></div>
    </div>
</div>

<!-- PANEL: ENVÍOS -->
<div class="tab-panel" id="panel-envios">
    <div class="lista" id="lista-envios">
        <div class="skeleton skeleton-envio"></div>
        <div class="skeleton skeleton-envio"></div>
        <div class="skeleton skeleton-envio"></div>
    </div>
</div>

<!-- ── NAV INFERIOR ── -->
<nav>
    <a href="/inicio"><i class="ti ti-home"></i><span>Inicio</span></a>
    <a href="/nuevo-reporte"><div class="nav-center"><i class="ti ti-plus"></i></div></a>
    <a href="/perfil"><i class="ti ti-user"></i><span>Perfil</span></a>
</nav>

<script>
    const token = localStorage.getItem('token');
    if (!token) window.location.href = '/login';

    function formatFecha(iso) {
        if (!iso) return '';
        const d = new Date(iso);
        return d.toLocaleDateString('es-PE', { day: '2-digit', month: 'short', year: 'numeric' });
    }
    function estadoBadgeClass(nombre) {
        if (!nombre) return 'badge-default';
        const n = nombre.toUpperCase();
        if (n.includes('PENDIENTE')) return 'badge-PENDIENTE';
        if (n.includes('PROCESO') || n.includes('PROGRESO')) return 'badge-EN_PROCESO';
        if (n.includes('RESUELTO')) return 'badge-RESUELTO';
        return 'badge-default';
    }

    function cambiarTab(tab) {
        document.getElementById('tab-casos').classList.toggle('activo', tab === 'casos');
        document.getElementById('tab-envios').classList.toggle('activo', tab === 'envios');
        document.getElementById('panel-casos').classList.toggle('activo', tab === 'casos');
        document.getElementById('panel-envios').classList.toggle('activo', tab === 'envios');
    }

    // ── CASOS MUNICIPALES ─────────────────────────────────────
    function renderCasos(data) {
        const cont = document.getElementById('lista-casos');
        if (!data || data.length === 0) {
            cont.innerHTML = `<p class="empty">Ninguno de tus envíos forma parte de un caso todavía.<br>
                Cuando se junten suficientes reportes sobre el mismo problema, aparecerá aquí.</p>`;
            return;
        }
        cont.innerHTML = data.map(r => {
            const badgeCls = estadoBadgeClass(r.estado);
            const imgHtml = r.fotoPrincipal
                ? `<img class="caso-img" src="${r.fotoPrincipal}" alt="${r.titulo}">`
                : `<div class="caso-img-placeholder"><i class="ti ti-photo"></i></div>`;
            return `
            <a href="/reporte-detalle?id=${r.id}" class="caso-card">
                <div class="caso-img-wrap">
                    ${imgHtml}
                    ${r.estado ? `<span class="badge-img ${badgeCls}">${r.estado}</span>` : ''}
                </div>
                <div class="caso-body">
                    <div class="caso-cat">${r.categoria || ''} ${r.nivelRiesgo ? `<span class="badge-riesgo badge-${r.nivelRiesgo}">${r.nivelRiesgo}</span>` : ''}</div>
                    <div class="caso-titulo">${r.titulo}</div>
                    <div class="caso-progreso-wrap">
                        <div class="caso-progreso-label"><span>Progreso</span><span>${r.porcentajeAvance || 0}%</span></div>
                        <div class="progress-bar"><div class="progress-fill" style="width:${r.porcentajeAvance || 0}%"></div></div>
                    </div>
                    <div class="caso-footer">
                        <span class="caso-personas"><i class="ti ti-users"></i> ${r.totalPersonas || 1} persona${r.totalPersonas === 1 ? '' : 's'} reportaron esto</span>
                        <span class="ver-detalle">Ver caso ›</span>
                    </div>
                </div>
            </a>`;
        }).join('');
    }

    async function cargarCasos() {
        try {
            const res = await fetch('/api/reportes/mis', { headers: { 'Authorization': 'Bearer ' + token } });
            const json = await res.json();
            renderCasos(json.data);
        } catch {
            document.getElementById('lista-casos').innerHTML = '<p class="empty">Error al cargar tus casos.</p>';
        }
    }

    // ── TUS ENVÍOS ────────────────────────────────────────────
    function renderEnvios(data) {
        const cont = document.getElementById('lista-envios');
        if (!data || data.length === 0) {
            cont.innerHTML = `<p class="empty">Aún no has enviado ningún reporte.<br>
                <a href="/nuevo-reporte">Enviar mi primer reporte →</a></p>`;
            document.getElementById('hdr-sub').textContent = '0 reportes enviados';
            return;
        }
        document.getElementById('hdr-sub').textContent =
            data.length + (data.length === 1 ? ' reporte enviado' : ' reportes enviados');

        cont.innerHTML = data.map(m => {
            const imgHtml = m.urlFoto
                ? `<img class="envio-img" src="${m.urlFoto}" alt="${m.titulo}">`
                : `<div class="envio-img-placeholder"><i class="ti ti-photo"></i></div>`;
            const enCaso = !!m.idReporte;
            const estadoHtml = enCaso
                ? `<span class="envio-estado en-caso"><i class="ti ti-link"></i> Ya forma parte de un caso</span>`
                : `<span class="envio-estado pendiente-caso"><i class="ti ti-clock"></i> Esperando más reportes similares</span>`;
            const href = enCaso ? `/reporte-detalle?id=${m.idReporte}` : '#';
            const clickable = enCaso ? '' : 'style="pointer-events:none"';

            return `
            <a href="${href}" class="envio-card" ${clickable}>
                ${imgHtml}
                <div class="envio-body">
                    <div class="envio-titulo">${m.titulo}</div>
                    <div class="envio-cat">${m.categoria || ''} ${m.nivelRiesgo ? '· ' + m.nivelRiesgo : ''}</div>
                    ${estadoHtml}
                    <div class="envio-fecha">${formatFecha(m.fechaCreacion)}</div>
                </div>
            </a>`;
        }).join('');
    }

    async function cargarEnvios() {
        try {
            const res = await fetch('/api/mini-reportes/mis', { headers: { 'Authorization': 'Bearer ' + token } });
            const json = await res.json();
            renderEnvios(json.data);
        } catch {
            document.getElementById('lista-envios').innerHTML = '<p class="empty">Error al cargar tus envíos.</p>';
        }
    }

    cargarCasos();
    cargarEnvios();

    async function ejecutarCerrarSesion() {
        try {
            const t = localStorage.getItem('token');
            if (t) await fetch('/api/auth/logout', { method: 'POST', headers: { 'Authorization': 'Bearer ' + t } });
        } catch (e) { console.error("Error al notificar al servidor:", e); }
        finally {
            localStorage.clear();
            sessionStorage.clear();
            window.location.href = '/login';
        }
    }
</script>
</body>
</html>
