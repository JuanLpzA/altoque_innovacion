<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Altoque – Inicio</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f0f5fb;
            min-height: 100dvh;
            padding-bottom: 80px;
            max-width: 480px;
            margin: 0 auto;
        }

        /* ── HEADER ── */
        .header {
            background: #1a3a8f;
            padding: 1.1rem 1.2rem 3.2rem;
            position: relative;

        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: .75rem;
        }

        .avatar-circle {
            width: 42px; height: 42px;
            border-radius: 50%;
            background: rgba(255,255,255,.2);
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }

        .avatar-circle i { color: #fff; font-size: 1.35rem; }

        .header-name {
            font-size: 1.25rem;
            font-weight: 800;
            color: #fff;
            letter-spacing: -.01em;
            line-height: 1.1;
        }

        .header-sub {
            font-size: .72rem;
            color: rgba(255,255,255,.7);
            margin-top: 1px;
        }

        .header-actions {
            display: flex;
            gap: .5rem;
        }

        .icon-btn {
            width: 38px; height: 38px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,.35);
            background: transparent;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            color: #fff;
            font-size: 1.05rem;
        }

        .icon-btn:active { background: rgba(255,255,255,.15); }

        /* ── STATS CARD (flotando sobre el header) ── */
        .stats-card {
            background: #fff;
            border-radius: 18px;
            margin: 0 1rem;
            margin-top: -2.2rem;
            padding: 1.1rem 1.3rem 1rem;
            box-shadow: 0 6px 24px rgba(26,58,143,.13);
            position: relative;
            z-index: 2;
        }

        .stats-header {
            display: flex;
            align-items: flex-start;
            gap: .75rem;
            margin-bottom: .6rem;
        }

        .stats-icon-box {
            width: 38px; height: 38px;
            border-radius: 10px;
            background: #e8f0fe;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }

        .stats-icon-box i { color: #1a3a8f; font-size: 1.2rem; }

        .stats-label {
            font-size: .78rem;
            font-weight: 600;
            color: #374151;
            line-height: 1.3;
        }

        .stats-count {
            font-size: 2.2rem;
            font-weight: 900;
            color: #1a3a8f;
            line-height: 1;
            letter-spacing: -.02em;
        }

        .stats-count span { color: #9ca3af; font-weight: 400; font-size: 1.6rem; }

        .stats-sub { font-size: .68rem; color: #9ca3af; margin-top: .3rem; }

        .progress-bar {
            background: #e5e7eb;
            border-radius: 99px;
            height: 6px;
            margin-top: .75rem;
            overflow: hidden;
        }

        .progress-fill {
            background: #1a3a8f;
            height: 100%;
            border-radius: 99px;
        }

        /* ── GRID ACCIONES ── */
        .acciones {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: auto auto;
            gap: .75rem;
            padding: 1rem;
        }

        .accion-btn {
            background: #fff;
            border: none;
            border-radius: 16px;
            padding: 1.1rem 1rem;
            text-align: center;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: .5rem;
            box-shadow: 0 2px 10px rgba(0,0,0,.06);
        }

        .accion-btn .a-icon { font-size: 1.7rem; color: #1a3a8f; }
        .accion-btn .a-label {
            font-size: .75rem;
            font-weight: 700;
            color: #1e293b;
            text-transform: uppercase;
            letter-spacing: .04em;
        }

        /* Botón CREAR NUEVO REPORTE — teal, ocupa col 2, filas 1-2 */
        .btn-nuevo {
            background: #0fa89a;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: .65rem;
            cursor: pointer;
            text-decoration: none;
            border: none;
            padding: 1.2rem .8rem;
            grid-column: 2;
            grid-row: 1 / 3;
            box-shadow: 0 4px 16px rgba(15,168,154,.3);
        }

        .btn-nuevo .n-label {
            font-size: .82rem;
            font-weight: 800;
            color: #fff;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: .05em;
            line-height: 1.2;
        }

        .plus-circle {
            width: 52px; height: 52px;
            border-radius: 50%;
            background: rgba(255,255,255,.25);
            display: flex; align-items: center; justify-content: center;
        }

        .plus-circle i { color: #fff; font-size: 1.8rem; }

        /* ── SECCIÓN REPORTES ── */
        .seccion {
            padding: .25rem 1rem .5rem;
        }

        .seccion-titulo {
            font-size: 1rem;
            font-weight: 700;
            color: #111827;
            margin-bottom: .7rem;
        }

        /* ── BUSCADOR ── */
        .search-wrap {
            margin: 0 1rem .85rem;
            position: relative;
        }

        .search-wrap i {
            position: absolute;
            left: 11px; top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
            font-size: 16px;
        }

        .search-wrap input {
            width: 100%;
            border: 1.5px solid #e5e7eb;
            border-radius: 12px;
            padding: .6rem .85rem .6rem 2.2rem;
            font-size: .85rem;
            background: #fff;
            outline: none;
            color: #374151;
        }

        .search-wrap input:focus { border-color: #1a3a8f; }

        /* ── TARJETAS REPORTE ── */
        .reporte-card {
            background: #fff;
            margin: 0 1rem .85rem;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 2px 14px rgba(0,0,0,.07);
        }

        .reporte-img-wrap {
            position: relative;
            width: 100%;
            height: 130px;
        }

        .reporte-img-placeholder {
            width: 100%; height: 100%;
            background: linear-gradient(135deg, #c8d8ec, #a8bdd8);
            display: flex; align-items: center; justify-content: center;
            color: #7a97b8; font-size: 2.2rem;
        }

        .reporte-img {
            width: 100%; height: 100%;
            object-fit: cover; display: block;
        }

        /* Badge estado sobre la imagen */
        .badge-img {
            position: absolute;
            top: 10px; right: 10px;
            font-size: .68rem;
            font-weight: 700;
            padding: .25rem .65rem;
            border-radius: 99px;
            backdrop-filter: blur(4px);
        }

        .badge-PENDIENTE   { background: rgba(239,68,68,.85);  color: #fff; }
        .badge-EN_PROCESO  { background: rgba(59,130,246,.85); color: #fff; }
        .badge-RESUELTO    { background: rgba(34,197,94,.85);  color: #fff; }
        .badge-default     { background: rgba(107,114,128,.8); color: #fff; }

        /* Badge nivel de riesgo (inline) */
        .badge-riesgo {
            font-size: .62rem;
            font-weight: 700;
            padding: .18rem .5rem;
            border-radius: 99px;
        }
        .badge-ALTO  { background: #fef2f2; color: #b91c1c; }
        .badge-MEDIO { background: #fffbeb; color: #b45309; }
        .badge-BAJO  { background: #f0fdf4; color: #15803d; }

        .reporte-body { padding: .85rem .9rem .9rem; }

        .reporte-titulo {
            font-size: .95rem;
            font-weight: 700;
            color: #111827;
            margin-bottom: .45rem;
        }

        .reporte-dir {
            display: flex;
            align-items: center;
            gap: .3rem;
            font-size: .75rem;
            color: #6b7280;
            margin-bottom: .5rem;
        }

        .reporte-dir i { color: #ef4444; font-size: 14px; }

        .reporte-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: .4rem;
        }

        .ver-detalle {
            font-size: .73rem;
            font-weight: 700;
            color: #1a3a8f;
            text-decoration: none;
            opacity: .85;
        }

        .progress-mini {
            font-size: .67rem;
            color: #9ca3af;
        }

        .empty {
            text-align: center;
            color: #9ca3af;
            padding: 2.5rem 1rem;
            font-size: .85rem;
        }

        /* ── NAV INFERIOR ── */
        nav {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            max-width: 480px;
            margin: 0 auto;
            background: #fff;
            border-top: 1px solid #e5e7eb;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: .45rem 0 .75rem;
            z-index: 10;
        }

        nav a {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: .1rem;
            font-size: .62rem;
            font-weight: 600;
            color: #9ca3af;
            text-decoration: none;
        }

        nav a.activo { color: #1a3a8f; }
        nav a i { font-size: 1.35rem; }

        .nav-center {
            background: #1a3a8f;
            width: 54px; height: 54px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin-top: -22px;
            border: 3px solid #fff;
            box-shadow: 0 4px 16px rgba(26,58,143,.35);
            text-decoration: none;
        }

        .stats-card {
            position: relative;
            z-index: 2;
        }

        body {
            background:
                linear-gradient(
                    to bottom,
                    #1a3a8f 0,
                    #1a3a8f 240px,
                    #f0f5fb 240px,
                    #f0f5fb 100%
                );
        }

        .nav-center i { color: #fff; font-size: 1.5rem; }
    </style>
</head>
<body>

<!-- ── HEADER ── -->
<div class="header">
    <div class="header-top">
        <div class="header-left">
            <div class="avatar-circle">
                <i class="ti ti-user"></i>
            </div>
            <div>
                <div class="header-name" id="hdr-nombre">Cargando...</div>
                <div class="header-sub" id="hdr-sub">—</div>
            </div>
        </div>
        <div class="header-actions">
            <button class="icon-btn" aria-label="Notificaciones">
                <i class="ti ti-bell"></i>
            </button>
            <button class="icon-btn" aria-label="Cerrar sesión" onclick="ejecutarCerrarSesion()">
                <i class="ti ti-power"></i>
            </button>
        </div>
    </div>
</div>

<!-- ── STATS CARD ── -->
<div class="stats-card">
    <div class="stats-header">
        <div class="stats-icon-box">
            <i class="ti ti-clipboard-list"></i>
        </div>
        <div class="stats-label">Cantidad de reportes atendidos</div>
    </div>
    <div class="stats-count" id="stats-count">—<span>/—</span></div>
    <div class="stats-sub">Cantidad en estado de procesos resueltos</div>
    <div class="progress-bar">
        <div class="progress-fill" id="stats-barra" style="width:0%"></div>
    </div>
</div>

<!-- ── ACCIONES ── -->
<div class="acciones">
    <a href="/mis-reportes" class="accion-btn">
        <i class="ti ti-clipboard-list a-icon"></i>
        <span class="a-label">Ver Reportes</span>
    </a>

    <a href="/nuevo-reporte" class="btn-nuevo">
        <span class="n-label">Crear Nuevo<br>Reporte</span>
        <div class="plus-circle">
            <i class="ti ti-plus"></i>
        </div>
    </a>

    <a href="#" class="accion-btn">
        <i class="ti ti-search a-icon"></i>
        <span class="a-label">Búsqueda</span>
    </a>
</div>

<!-- ── REPORTES CIUDADANOS ── -->
<div class="seccion">
    <div class="seccion-titulo">Reportes Ciudadanos</div>
</div>

<div class="search-wrap">
    <i class="ti ti-search"></i>
    <input type="text" id="buscar-input" placeholder="Buscar reportes...">
</div>

<div id="lista-reportes">
    <p class="empty">Buscando tu ubicación...</p>
</div>

<!-- ── NAV INFERIOR ── -->
<nav>
    <a href="/inicio" class="activo">
        <i class="ti ti-home"></i>
        <span>Inicio</span>
    </a>
    <a href="/nuevo-reporte">
        <div class="nav-center">
            <i class="ti ti-plus"></i>
        </div>
    </a>
    <a href="#">
        <i class="ti ti-user"></i>
        <span>Perfil</span>
    </a>
</nav>

<script>
    const token = localStorage.getItem('token');
    if (!token) { window.location.href = '/login'; }

    const nombreGuardado = localStorage.getItem('nombre') || '';
    document.getElementById('hdr-nombre').textContent = nombreGuardado.toUpperCase();
    document.getElementById('hdr-sub').textContent = localStorage.getItem('apellido') || '';

    function estadoBadgeClass(nombre) {
        if (!nombre) return 'badge-default';
        const n = nombre.toUpperCase();
        if (n.includes('PENDIENTE')) return 'badge-PENDIENTE';
        if (n.includes('PROCESO') || n.includes('PROGRESO')) return 'badge-EN_PROCESO';
        if (n.includes('RESUELTO')) return 'badge-RESUELTO';
        return 'badge-default';
    }

    function nivelBadge(nivel) {
        if (!nivel) return '';
        return `<span class="badge-riesgo badge-${nivel}">${nivel}</span>`;
    }

    function renderReportes(data) {
        const cont = document.getElementById('lista-reportes');
        if (!data || data.length === 0) {
            cont.innerHTML = '<p class="empty">No hay reportes cercanos por ahora.</p>';
            return;
        }
        cont.innerHTML = data.map(r => {
            const estadoNombre = r.estado || '';
            const badgeCls = estadoBadgeClass(estadoNombre);
            // ← Ahora usa fotoPrincipal del DTO
            const imgHtml = r.fotoPrincipal
                ? `<img class="reporte-img" src="${r.fotoPrincipal}" alt="${r.titulo}">`
                : `<div class="reporte-img-placeholder"><i class="ti ti-photo"></i></div>`;
            // Dirección: usa zonaReferencia o el primer mini reporte
            const direccion = r.zonaReferencia || 'Sin dirección';
            return `
            <div class="reporte-card">
                <div class="reporte-img-wrap">
                    ${imgHtml}
                    ${estadoNombre ? `<span class="badge-img ${badgeCls}">${estadoNombre}</span>` : ''}
                </div>
                <div class="reporte-body">
                    <div class="reporte-titulo">${r.titulo}</div>
                    <div class="reporte-dir">
                        <i class="ti ti-map-pin"></i>
                        <span>${direccion}</span>
                    </div>
                    <div class="reporte-footer">
                        <span class="progress-mini">
                            ${r.categoria ? r.categoria + ' · ' : ''}
                            ${r.nivelRiesgo ? nivelBadge(r.nivelRiesgo) : ''}
                        </span>
                        <a href="/reporte-detalle?id=${r.id}" class="ver-detalle">Ver detalle ›</a>
                    </div>
                </div>
            </div>`;
        }).join('');

        // Stats
        const total = data.length;
        const atendidos = data.filter(r => {
            const n = (r.estado || '').toUpperCase();
            return n.includes('PROCESO') || n.includes('PROGRESO') || n.includes('RESUELTO');
        }).length;
        const pct = total > 0 ? Math.round((atendidos / total) * 100) : 0;
        document.getElementById('stats-count').innerHTML =
            `${String(atendidos).padStart(2,'0')}<span>/${String(total).padStart(2,'0')}</span>`;
        document.getElementById('stats-barra').style.width = pct + '%';
    }

    function cargarReportesCercanos(lat, lng) {
        fetch(`/api/reportes/cercanos?lat=${lat}&lng=${lng}`, {
            headers: { 'Authorization': 'Bearer ' + token }
        })
        .then(r => r.json())
        .then(json => { renderReportes(json.data); })
        .catch(() => {
            document.getElementById('lista-reportes').innerHTML =
                '<p class="empty">No se pudieron cargar los reportes.</p>';
        });
    }

    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
            pos => cargarReportesCercanos(pos.coords.latitude, pos.coords.longitude),
            ()  => cargarReportesCercanos(-6.7714, -79.8409)
        );
    } else {
        cargarReportesCercanos(-6.7714, -79.8409);
    }

    document.getElementById('buscar-input').addEventListener('input', function () {
        const q = this.value.toLowerCase();
        document.querySelectorAll('.reporte-card').forEach(card => {
            const titulo = card.querySelector('.reporte-titulo').textContent.toLowerCase();
            card.style.display = titulo.includes(q) ? '' : 'none';
        });
    });

    async function ejecutarCerrarSesion() {
        try {
            const t = localStorage.getItem('token');
            if (t) {
                await fetch('/api/auth/logout', {
                    method: 'POST',
                    headers: { 'Authorization': 'Bearer ' + t }
                });
            }
        } catch (e) {
            console.error("Error al revocar el token:", e);
        } finally {
            localStorage.clear();
            window.location.href = '/login';
        }
    }
</script>
</body>
</html>
